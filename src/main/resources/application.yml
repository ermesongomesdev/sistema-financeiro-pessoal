spring:
  application:
    name: sistema-financeiro-pessoal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:sua-chave-jwt-super-secreta-com-mais-de-32-caracteres}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  notifications:
    days-before-due: 3

springdoc:
  swagger-ui:
    path: /swagger-ui.html
